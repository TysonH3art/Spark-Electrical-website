<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sparky Electrical Services | Enquiry</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <!-- Site-wide header: logo + navigation menu -->
        <a href="index.html"><img src="images/logo.png" alt="Sparky Electrical Services logo" style="width:200px; height:60px;"></a>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="services.html">Services</a>
            <a href="enquiry.html">Enquiry</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <h1>Request a Free Quote</h1>
        <p>Fill in the form below and one of our electricians will get back to you with a quote, usually within 24 hours.</p>

        <!-- Basic HTML form structure for Part 1. -->
        <!-- Client-side JavaScript validation gets added in Part 3, not now. -->
        <form action="#" method="post">
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone">

            <label for="enquiry-type">Type of Job:</label>
            <select id="enquiry-type" name="enquiry-type">
                <option value="installation">New Installation</option>
                <option value="repair">Repair / Fault Finding</option>
                <option value="coc">Certificate of Compliance (COC)</option>
                <option value="other">Other</option>
            </select>

            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="5" placeholder="Tell us a bit about the job, e.g. location and what needs doing."></textarea>

            <button type="submit">Submit Enquiry</button>
        </form>
    </main>

    <footer>

</body>
</html>
