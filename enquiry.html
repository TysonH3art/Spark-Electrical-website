<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sparky Electrical Services | Enquiry</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="site-header">
        <a href="index.html" class="logo-link">
            <img src="images/logo.png" alt="Sparky Electrical Services logo" class="logo">
        </a>
        <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation menu">&#9776;</button>
        <nav class="main-nav" id="mainNav">
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="services.html">Services</a>
            <a href="enquiry.html" class="active">Enquiry</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main class="page-content narrow">
        <h1>Request a Free Quote</h1>
        <p>Fill in the form below and one of our electricians will get back to you with a quote, usually within 24 hours.</p>

        <form action="#" method="post" class="site-form">
            <div class="form-group">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone">
            </div>

            <div class="form-group">
                <label for="enquiry-type">Type of Job:</label>
                <select id="enquiry-type" name="enquiry-type">
                    <option value="installation">New Installation</option>
                    <option value="repair">Repair / Fault Finding</option>
                    <option value="coc">Certificate of Compliance (COC)</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" placeholder="Tell us a bit about the job, e.g. location and what needs doing."></textarea>
            </div>

            <button type="submit" class="btn btn-primary">Submit Enquiry</button>
        </form>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Sparky Electrical Services. All rights reserved.</p>
        <p>Student: Lesego Tlhako | Student Number: ST10511722</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
